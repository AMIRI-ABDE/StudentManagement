upstream backend {
    server backend-v1:8080 weight=9;
    server backend-v2:8080 weight=1;
}

upstream backend_v1_only {
    server backend-v1:8080;
}

server {
    listen 80;
    server_name _;

    # Frontend (Angular)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests: canary routing (90% v1, 10% v2)
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through the backend version header
        proxy_pass_header X-Backend-Version;
    }

    # Health check endpoints (direct access, no canary)
    location /v1/actuator/ {
        proxy_pass http://backend-v1:8080/actuator/;
    }

    location /v2/actuator/ {
        proxy_pass http://backend-v2:8080/actuator/;
    }

    # H2 Console (v1 only)
    location /h2-console {
        proxy_pass http://backend-v1:8080/h2-console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
