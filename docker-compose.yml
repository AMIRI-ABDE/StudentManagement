services:
  # ─────────── Nginx Reverse Proxy (Canary Router) ───────────
  nginx:
    image: nginx:alpine
    container_name: student-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/custom:ro
    command: /bin/sh -c "cp /etc/nginx/custom/nginx.conf /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - backend-v1
      - backend-v2
    networks:
      - student-network
    mem_limit: 64m

  # ─────────── Frontend (Angular) ───────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student-frontend
    restart: always
    # No port mapping: only accessible through nginx
    expose:
      - "80"
    networks:
      - student-network
    mem_limit: 64m

  # ─────────── Backend V1 (Stable) ───────────
  backend-v1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-backend-v1
    restart: always
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - APP_VERSION=v1
      - UNLEASH_API_URL=http://unleash:4242/api
      - UNLEASH_API_TOKEN=default:development.unleash-insecure-api-token
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      unleash:
        condition: service_healthy
    networks:
      student-network:
        aliases:
          - backend
    mem_limit: 384m

  # ─────────── Backend V2 (Canary) ───────────
  backend-v2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-backend-v2
    restart: always
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m
      - APP_VERSION=v2
      - UNLEASH_API_URL=http://unleash:4242/api
      - UNLEASH_API_TOKEN=default:development.unleash-insecure-api-token
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      unleash:
        condition: service_healthy
    networks:
      - student-network
    mem_limit: 384m

  # ─────────── Unleash (Feature Flags) ───────────
  unleash:
    image: unleashorg/unleash-server:latest
    container_name: student-unleash
    restart: always
    environment:
      - DATABASE_URL=postgres://unleash:unleash@unleash-db:5432/unleash
      - DATABASE_SSL=false
      - INIT_ADMIN_API_TOKENS=*:*.unleash-insecure-admin-api-token
      - INIT_CLIENT_API_TOKENS=default:development.unleash-insecure-api-token,*:development.unleash-insecure-api-token
      - LOG_LEVEL=warn
    expose:
      - "4242"
    ports:
      - "4242:4242"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4242/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      unleash-db:
        condition: service_healthy
    networks:
      - student-network
    mem_limit: 256m

  # ─────────── PostgreSQL for Unleash ───────────
  unleash-db:
    image: postgres:15-alpine
    container_name: student-unleash-db
    restart: always
    environment:
      - POSTGRES_DB=unleash
      - POSTGRES_USER=unleash
      - POSTGRES_PASSWORD=unleash
    volumes:
      - unleash-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - student-network
    mem_limit: 128m

networks:
  student-network:
    driver: bridge

volumes:
  unleash-db-data:
