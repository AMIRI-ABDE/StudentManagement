# ──────────────── Server ────────────────
server.port=8080

# ──────────────── H2 Database ────────────────
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# ──────────────── JWT ────────────────
jwt.secret=YourSuperSecretKeyForJWTMustBeAtLeast256BitsLong!!
jwt.expiration-ms=86400000

# ──────────────── Logging ────────────────
logging.level.org.springframework.security=DEBUG

# ──────────────── Actuator ────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ──────────────── App Version ────────────────
app.version=${APP_VERSION:v1}

# ──────────────── Unleash Feature Flags ────────────────
unleash.api-url=${UNLEASH_API_URL:http://unleash:4242/api}
unleash.api-token=${UNLEASH_API_TOKEN:default:development.unleash-insecure-api-token}
unleash.app-name=student-management
unleash.environment=development
